<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Telefon Optimizer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --surface: #f8fafc;
            --border: #e5e7eb;
            --text: #0f172a;
            --muted: #64748b;
            --faint: #94a3b8;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --success: #059669;
            --success-hover: #047857;
            --success-soft: #ecfdf5;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 40px rgba(15, 23, 42, .08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1020;
                --card: #121a2e;
                --surface: #182238;
                --border: #26314a;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --faint: #64748b;
                --primary: #6366f1;
                --primary-hover: #818cf8;
                --primary-soft: rgba(99, 102, 241, .14);
                --success: #10b981;
                --success-hover: #34d399;
                --success-soft: rgba(16, 185, 129, .12);
                --danger: #f87171;
                --danger-soft: rgba(248, 113, 113, .12);
                --shadow: 0 12px 40px rgba(0, 0, 0, .35);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 500px at 50% -200px, var(--primary-soft), transparent),
                var(--bg);
            padding: 48px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        /* ---------- HEADER ---------- */

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 10px 24px rgba(99, 102, 241, .35);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        /* ---------- CARD ---------- */

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .section + .section {
            margin-top: 24px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ---------- UPLOAD ---------- */

        .upload {
            display: block;
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--surface);
            transition: border-color .2s, background .2s, transform .2s;
        }

        .upload:hover,
        .upload.dragover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .upload.dragover {
            transform: scale(1.01);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: var(--primary-soft);
            color: var(--primary);
        }

        .upload-title {
            font-size: 16px;
            font-weight: 700;
        }

        .upload-title span {
            color: var(--primary);
        }

        .upload-info {
            margin-top: 4px;
            color: var(--faint);
            font-size: 13px;
        }

        #fileInput { display: none; }

        /* ---------- FILE LIST ---------- */

        .file-list { display: none; margin-top: 16px; }

        .clear-all {
            border: none;
            background: none;
            color: var(--muted);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
            padding: 0;
        }

        .clear-all:hover { color: var(--danger); }

        .file-item,
        .job {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
        }

        .file-item + .file-item,
        .job + .job {
            margin-top: 8px;
        }

        .file-badge {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 10px;
            font-weight: 800;
            color: var(--danger);
            background: var(--danger-soft);
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 14px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-meta {
            font-size: 12px;
            color: var(--faint);
            margin-top: 2px;
        }

        .icon-button {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: var(--faint);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: .15s;
        }

        .icon-button:hover {
            background: var(--danger-soft);
            color: var(--danger);
        }

        /* ---------- SETTINGS ---------- */

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field {
            padding: 14px 16px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .field-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .field label {
            font-size: 14px;
            font-weight: 600;
        }

        .field-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: var(--faint);
        }

        /* ---------- BUTTONS ---------- */

        .button {
            width: 100%;
            margin-top: 24px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background .15s, transform .1s;
        }

        .button:active { transform: translateY(1px); }

        .button-primary { background: var(--primary); }
        .button-primary:hover { background: var(--primary-hover); }

        .button-primary:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .button-success {
            margin-top: 0;
            background: var(--success);
        }

        .button-success:hover { background: var(--success-hover); }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, .4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- PROGRESS ---------- */

        .batch { display: none; }

        .overall-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        #overallPercent {
            font-variant-numeric: tabular-nums;
            color: var(--primary);
        }

        .progress {
            height: 8px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width .3s;
        }

        .jobs { margin-top: 16px; }

        .job { flex-wrap: wrap; }

        .job .progress {
            flex-basis: 100%;
            height: 5px;
        }

        .status {
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 99px;
        }

        .status.waiting { color: var(--muted); background: var(--surface); }
        .status.processing { color: var(--primary); background: var(--primary-soft); }
        .status.done { color: var(--success); background: var(--success-soft); }
        .status.error { color: var(--danger); background: var(--danger-soft); }

        .job-download {
            flex-shrink: 0;
            display: none;
            color: var(--success);
        }

        .job-download:hover {
            background: var(--success-soft);
            color: var(--success);
        }

        /* ---------- RESULT ---------- */

        .success {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 16px;
            background: var(--success-soft);
            text-align: center;
        }

        .success-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 14px;
        }

        .error-box {
            display: none;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--danger);
            background: var(--danger-soft);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--faint);
        }

        @media (max-width: 600px) {
            body { padding: 28px 16px; }
            .card { padding: 18px; }
            .settings { grid-template-columns: 1fr; }
            h1 { font-size: 23px; }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
        </div>

        <h1>PDF Telefon Optimizer</h1>

        <p class="subtitle">
            Uzun PDF sahifalarini telefonda o'qishga qulay bo'laklarga ajrating
        </p>

    </div>


    <div class="card">

        <!-- UPLOAD -->

        <div class="section">

            <label class="upload" for="fileInput" id="dropZone">

                <div class="upload-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>

                <div class="upload-title">
                    PDFlarni shu yerga tashlang yoki <span>tanlang</span>
                </div>

                <div class="upload-info">
                    Bir vaqtning o'zida bir nechta fayl tanlash mumkin
                </div>

            </label>

            <input id="fileInput" type="file" accept=".pdf,application/pdf" multiple>


            <!-- FILE LIST -->

            <div class="file-list" id="fileList">

                <div class="section-title">
                    <span>Tanlangan fayllar (<span id="fileCount">0</span>)</span>
                    <button class="clear-all" onclick="clearFiles()">Hammasini tozalash</button>
                </div>

                <div id="files"></div>

            </div>

        </div>


        <!-- SETTINGS -->

        <div class="section">

            <div class="section-title">Sozlamalar</div>

            <div class="settings">

                <div class="field">

                    <div class="field-top">
                        <label for="chunkHeight">Kesish balandligi</label>
                        <span class="field-value" id="chunkHeightValue">1400 px</span>
                    </div>

                    <input id="chunkHeight" type="range" value="1400" min="500" max="5000" step="100">

                    <div class="hint">Redmi 9A uchun: 1200–1400 px</div>

                </div>


                <div class="field">

                    <div class="field-top">
                        <label for="quality">JPEG sifati</label>
                        <span class="field-value" id="qualityValue">80%</span>
                    </div>

                    <input id="quality" type="range" value="80" min="40" max="95" step="5">

                    <div class="hint">Tavsiya: 75–85%</div>

                </div>

            </div>

        </div>


        <!-- START -->

        <button class="button button-primary" id="startButton" onclick="startOptimization()"></button>


        <!-- BATCH -->

        <div class="section batch" id="batch">

            <div class="overall-top">
                <span>Umumiy progress</span>
                <span id="overallPercent">0%</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="overallBar"></div>
            </div>

            <div class="jobs" id="jobs"></div>

        </div>


        <!-- SUCCESS -->

        <div class="success" id="success">

            <div class="success-title" id="successTitle"></div>

            <a class="button button-success" id="downloadButton" href="#"></a>

        </div>


        <!-- ERROR -->

        <div class="error-box" id="errorBox"></div>

    </div>

    <div class="footer">
        Fayllar faqat shu kompyuterda qayta ishlanadi
    </div>

</div>


<script>

const ICON_DOWNLOAD = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
const ICON_CLOSE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
const START_LABEL = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Optimallashtirish`;

let selectedFiles = [];
let currentBatchId = null;

const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const fileList = document.getElementById("fileList");
const filesContainer = document.getElementById("files");
const fileCount = document.getElementById("fileCount");
const startButton = document.getElementById("startButton");
const batch = document.getElementById("batch");
const jobsContainer = document.getElementById("jobs");
const success = document.getElementById("success");
const successTitle = document.getElementById("successTitle");
const downloadButton = document.getElementById("downloadButton");
const errorBox = document.getElementById("errorBox");
const overallBar = document.getElementById("overallBar");
const overallPercent = document.getElementById("overallPercent");
const chunkHeight = document.getElementById("chunkHeight");
const quality = document.getElementById("quality");

startButton.innerHTML = START_LABEL;


/*
    Slider qiymatlari
*/

chunkHeight.addEventListener("input", () => {
    document.getElementById("chunkHeightValue").textContent = chunkHeight.value + " px";
});

quality.addEventListener("input", () => {
    document.getElementById("qualityValue").textContent = quality.value + "%";
});


/*
    PDF tanlash / drag & drop
*/

function addFiles(newFiles) {

    // Oldingi natija ochiq bo'lsa, yangi fayl tanlanganda yashiriladi
    if (!startButton.disabled) {
        batch.style.display = "none";
        success.style.display = "none";
        errorBox.style.display = "none";
    }

    for (const file of newFiles) {

        if (!file.name.toLowerCase().endsWith(".pdf")) continue;

        const exists = selectedFiles.some(
            existing => existing.name === file.name && existing.size === file.size
        );

        if (!exists) selectedFiles.push(file);

    }

    renderFiles();

}

fileInput.addEventListener("change", function () {

    addFiles(Array.from(this.files));

    // Inputni tozalash, yana PDF qo'shish mumkin
    this.value = "";

});

["dragenter", "dragover"].forEach(eventName => {
    dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.add("dragover");
    });
});

["dragleave", "drop"].forEach(eventName => {
    dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.remove("dragover");
    });
});

dropZone.addEventListener("drop", event => {
    addFiles(Array.from(event.dataTransfer.files));
});


/*
    Fayllarni ko'rsatish
*/

function renderFiles() {

    filesContainer.innerHTML = "";
    fileCount.textContent = selectedFiles.length;
    fileList.style.display = selectedFiles.length ? "block" : "none";

    selectedFiles.forEach((file, index) => {

        const item = document.createElement("div");
        item.className = "file-item";

        item.innerHTML = `
            <div class="file-badge">PDF</div>
            <div class="file-info">
                <div class="file-name">${escapeHtml(file.name)}</div>
                <div class="file-meta">${formatSize(file.size)}</div>
            </div>
            <button class="icon-button" title="O'chirish" onclick="removeFile(${index})">${ICON_CLOSE}</button>
        `;

        filesContainer.appendChild(item);

    });

}

function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderFiles();
}

function clearFiles() {
    selectedFiles = [];
    renderFiles();
}


/*
    Yordamchilar
*/

function formatSize(bytes) {

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / 1024 / 1024).toFixed(1) + " MB";

}

// XSSdan himoya
function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function resetButton() {
    startButton.disabled = false;
    startButton.innerHTML = START_LABEL;
}


/*
    Start
*/

async function startOptimization() {

    errorBox.style.display = "none";
    success.style.display = "none";

    if (selectedFiles.length === 0) {
        showError("Avval kamida bitta PDF tanlang.");
        return;
    }

    const formData = new FormData();

    selectedFiles.forEach(file => formData.append("pdfs", file));
    formData.append("chunk_h", chunkHeight.value);
    formData.append("quality", quality.value);

    startButton.disabled = true;
    startButton.innerHTML = `<span class="spinner"></span> Ishlanmoqda...`;

    overallBar.style.width = "0%";
    overallPercent.textContent = "0%";
    jobsContainer.innerHTML = "";
    batch.style.display = "block";

    try {

        const response = await fetch("/optimize", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Xatolik yuz berdi.");
        }

        currentBatchId = data.batch_id;
        pollProgress(currentBatchId);

    } catch (error) {

        showError(error.message);
        resetButton();

    }

}


/*
    Progress tekshirish
*/

function pollProgress(batchId) {

    const interval = setInterval(async () => {

        try {

            const response = await fetch("/progress/" + batchId);
            const data = await response.json();

            updateUI(batchId, data);

            if (data.status === "done" || data.status === "error") {
                clearInterval(interval);
            }

        } catch (error) {

            clearInterval(interval);
            showError(error.message);
            resetButton();

        }

    }, 700);

}


/*
    UI yangilash
*/

const STATUS_LABELS = {
    waiting: "Kutmoqda",
    processing: "Ishlanmoqda",
    done: "Tayyor",
    error: "Xato"
};

function renderJob(batchId, item) {

    const job = document.createElement("div");
    job.className = "job";
    job.id = "job-" + item.id;

    job.innerHTML = `
        <div class="file-badge">PDF</div>
        <div class="file-info">
            <div class="file-name">${escapeHtml(item.name)}</div>
            <div class="file-meta" data-info></div>
        </div>
        <span class="status" data-status></span>
        <a class="icon-button job-download" title="Yuklab olish"
           href="/download/${batchId}/${item.id}" data-download>${ICON_DOWNLOAD}</a>
        <div class="progress"><div class="progress-bar" data-bar></div></div>
    `;

    jobsContainer.appendChild(job);

    return job;

}

function updateUI(batchId, data) {

    const overall = data.overall_progress || 0;

    overallBar.style.width = overall + "%";
    overallPercent.textContent = overall + "%";

    const items = Object.values(data.files || {});

    items.forEach(item => {

        const job = document.getElementById("job-" + item.id) || renderJob(batchId, item);

        const status = job.querySelector("[data-status]");
        const info = job.querySelector("[data-info]");

        job.querySelector("[data-bar]").style.width = (item.progress || 0) + "%";

        status.textContent = STATUS_LABELS[item.status] || item.status;
        status.className = "status " + item.status;

        if (item.status === "waiting") {
            info.textContent = "Navbatda...";
        }

        if (item.status === "processing") {
            info.textContent = item.current_page + " / " + item.total_pages + " sahifa";
        }

        if (item.status === "done") {
            info.textContent = item.total_pages + " sahifa · " + formatSize(item.output_size || 0);
        }

        if (item.status === "error") {
            info.textContent = item.error || "Noma'lum xato";
        }

        // Har bir faylni alohida yuklab olish (bir nechta fayl bo'lsa)
        job.querySelector("[data-download]").style.display =
            item.status === "done" && data.status === "done" && items.length > 1 ? "grid" : "none";

    });

    if (data.status === "done") {

        resetButton();

        if (!data.download_type) {
            showError("Hech bir PDF optimallashtirilmadi.");
            return;
        }

        // Ishlangan fayllar ro'yxatdan olib tashlanadi,
        // keyingi safar faqat yangi tanlanganlar yuboriladi
        selectedFiles = [];
        renderFiles();

        const doneCount = items.filter(item => item.status === "done").length;

        downloadButton.href = "/download/" + batchId;

        if (data.download_type === "pdf") {
            successTitle.textContent = "PDF tayyor!";
            downloadButton.innerHTML = ICON_DOWNLOAD + " PDFni yuklab olish";
        } else {
            successTitle.textContent = doneCount + " ta PDF tayyor!";
            downloadButton.innerHTML = ICON_DOWNLOAD + " Hammasini ZIP qilib yuklab olish";
        }

        success.style.display = "block";

    }

    if (data.status === "error") {
        showError(data.error || "Batchni qayta ishlashda xatolik.");
        resetButton();
    }

}

</script>
